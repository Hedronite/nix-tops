# Floors for the nixos-module facet. All numbers are proposed; calibrated in M4.6.
# A facet sets floors only: it never turns a law on or off (NIX_TOPS.md 5.2).
# Eval cost is advisory in every profile for 0.x (NIX_TOPS.md 6.4).
# built: n/a. tested: every module eval-tested; every service module VM-tested.
facet = "nixos-module"
protocol = "0.2.0"

[toolchain]
systems = ["x86_64-linux", "aarch64-linux"]

[eval]
all_systems = false
abort_on_warn = true
allow_ifd = false

[coverage]
tested_floor = 100

[budgets.eval_cost]
mode = "advisory"

[layers]
vm_tests = { enabled = true }
rebuild = { enabled = false }
vulnix = { enabled = false }
