id = "N-15"
title = "Library references resolve at the floor"
law = "Every `lib.<name>` and `builtins.<name>` reference resolves in the locked inputs and exists at the Nix floor the config declares (`[toolchain].nix_floor`), not only in the Nix the gate runs. The analyzer collects each selection path and checks it with `lib.hasAttrByPath` against the pinned `lib` and `builtins`; extended `lib` (`lib.hm`, flake-parts, `lib.extend`) is resolved against the extended set."
severity = "Refuse"
reader = "an"
reader_also = ["ev"]
judged = true
sketch = "§4"
rationale = "A builtin newer than the declared floor passes the gate and breaks for users at the floor; an extended `lib` is a false positive otherwise."
fix = "Use a name that exists at the floor, or raise the floor."
