id = "N-21"
title = "mkForce and low-priority mkOverride carry an ack"
law = "`lib.mkForce`, and `lib.mkOverride` with a priority below 100, carry an ack naming the definition they override."
severity = "Ack"
classes = ["nixos-module"]
reader = "an"
judged = false
rationale = "A forced value silently wins over other modules' definitions."
fix = "Ack the override with the definition it replaces, or use a normal priority."
