id = "N-19"
title = "Options have type and description"
law = "Every declared option has `type` and `description`. `types.anything`, `types.attrs` and `types.unspecified` need an ack."
severity = "Ack"
classes = ["nixos-module"]
reader = "ev"
reader_detail = "options tree"
judged = false
rationale = "Untyped options accept any value and give no error for a wrong one."
fix = "Give the option a precise type and a description."
