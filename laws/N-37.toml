id = "N-37"
title = "Firewall off or wide ports carry an ack"
law = "`networking.firewall.enable = false`, and port ranges wider than the services need, carry an ack."
severity = "Ack"
classes = ["nixos-host"]
reader = "ev"
judged = false
rationale = "An open firewall exposes every listening service."
fix = "Open only the ports the services need, or ack the exception."
