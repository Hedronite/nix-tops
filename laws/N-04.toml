id = "N-04"
title = "Tracked files and a clean tree"
law = "No untracked, non-ignored `.nix` file under the flake root, and in CI the working tree equals `HEAD` (a file that is staged and not committed counts as untracked). A flake reads tracked files only: an untracked file that is imported fails with \"path does not exist\" on the machine that has it, and a staged but uncommitted file passes there and fails in CI. Ignored directories such as `.direnv` are exempt"
severity = "Refuse"
artifacts = ["flake"]
reader = "an"
reader_detail = "an: git"
judged = true
sketch = "§1"
rationale = "A flake copies tracked files only, so a file the flake reads but git does not track breaks evaluation, and a staged but uncommitted file passes locally and fails in CI."
fix = "`git add` and commit the file, or ignore it. Do not stage files you did not write."
