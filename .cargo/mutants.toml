# Rust-TOPS drop-in. Place at .cargo/mutants.toml
exclude_re = [
  "src/generated/",
  "/pb\\.rs$",
  "tests/",
  "benches/",
  "examples/",
]
examine_re = ["src/"]
timeout_multiplier = 2.0
# A floor under the automatic timeout: on a loaded build host the unmutated suite alone can take
# longer than twice a quiet baseline, and a mutant is then reported as a timeout, not as caught.
minimum_test_timeout = 90
