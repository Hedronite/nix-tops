# The kit gates itself (NIX_TOPS.md section 11). Gates 1 to 4 run: source, lint, eval and
# build-test. The other layers are switched off with a reason until they are built, and law-diff
# stops a later change from switching a built layer off without the protocol-change label.
protocol = "0.2.0"
facets = ["flake-lib", "package-set", "dev-flake"]
enforce = "hard"

[toolchain]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]

[eval]
all_systems = true
abort_on_warn = true
allow_ifd = false

[layers]
coverage = { enabled = false, reason = "not built in M2" }
facet-layers = { enabled = false, reason = "not built in M2" }
laws = { enabled = false, reason = "not built in M2" }
