protocol = "0.2.0"
facets = ["home-config"]
enforce = "ratchet"
baseline = ".nix-tops/baseline.json"
nixpkgs_input = "nixpkgs"

[toolchain]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]

[eval]
all_systems = true
abort_on_warn = true
allow_ifd = false

[layers]
vm_tests = { enabled = false }
rebuild = { enabled = false }
