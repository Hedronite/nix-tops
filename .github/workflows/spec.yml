name: spec

# Checks the spec itself: links, the law catalog counts, the schemas and profiles, and the
# generated copies of the stated rules.
# Never use pull_request_target here: this workflow runs code from the PR.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec:
    name: spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install check-jsonschema
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.38.0
      - name: Tests for the checkers
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Spec checks
        run: python3 scripts/spec_check.py all
      - name: Generated rules match section 3.4
        run: python3 scripts/rules_gen.py check
