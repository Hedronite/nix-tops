name: trial

# The kit's own command over the eight pinned flakes of docs/evidence/2026-11-16-gate3-trial/refs.txt,
# eval only, compared with the README's table of that directory. A difference fails the run and is a
# finding: it is written down with its cause, never fixed by editing the expected column. Runs on a
# schedule and on demand, not on pull requests: it needs the network and takes a while.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trial:
    name: gate 3 over the trial flakes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            sandbox = true
            experimental-features = nix-command flakes
      - name: Build the runner
        run: nix build .#nixtops --no-update-lock-file --no-accept-flake-config -L
      - name: Run the trial
        env:
          NIXTOPS: ${{ github.workspace }}/result/bin/nixtops
        run: |
          set +e
          scripts/trial.sh "$RUNNER_TEMP/trial"
          code=$?
          { echo "## Gate 3 trial"; echo; cat "$RUNNER_TEMP/trial/table.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Keep the table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trial-table
          path: |
            ${{ runner.temp }}/trial/table.md
            ${{ runner.temp }}/trial/results.json
          if-no-files-found: warn
