name: nix-tops

# The kit gates itself (NIX_TOPS.md section 11). It starts from config/workflow.template.yml: the same
# gate and determinate jobs, plus a step that fails if fewer layers ran than nix-tops.toml enables,
# and the law-diff job.
# One job runs one command; the workflow does not repeat the tools as steps, because steps that
# bypass nixtops judge nothing.
# Every nix command passes --no-accept-flake-config, so a flake cannot change the gate's settings.
# Never use pull_request_target here: this workflow runs code from the PR.
# The tier 2 jobs of section 11 (build-matrix, nightly) arrive with the layers they run.
on:
  pull_request:
    # labeled and unlabeled re-run law-diff, so adding the protocol-change label clears it without a push
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a label event has its own group, so it never cancels a gate run in progress
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' || github.event.action == 'unlabeled' }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (x86_64-linux, sandbox)
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            sandbox = true
            experimental-features = nix-command flakes
      - name: Gate
        run: nix run .#nixtops --no-update-lock-file --no-accept-flake-config -- gate --max-tier 1
      - name: Plant (throwaway) drop a layer from the report
        run: python3 -c "import json;p='.nix-tops/report.json';d=json.load(open(p));d['layers']=[l for l in d['layers'] if l['id']!='eval'];json.dump(d,open(p,'w'))"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Every enabled layer ran
        run: python3 scripts/layers_ran.py

  determinate:
    name: gate (Determinate Nix)
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The named Determinate leg of section 2: lazy trees and parallel eval off.
      NIX_CONFIG: |
        lazy-trees = false
        eval-cores = 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: Gate
        run: nix run .#nixtops --no-update-lock-file --no-accept-flake-config -- gate --max-tier 1 --evaluator host
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Every enabled layer ran
        run: python3 scripts/layers_ran.py

  law-diff:
    name: law-diff (base branch script)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The change, as data: its files are parsed, never run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: head
      # The base commit: the script that judges the change comes from here, never from the change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: base
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: law-diff
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ ! -f base/scripts/law_diff.py ]; then
            echo "law-diff: vacuous: the base branch has no scripts/law_diff.py yet"
            echo "::notice title=law-diff::vacuous: the base branch has no scripts/law_diff.py yet"
            exit 0
          fi
          python3 -I base/scripts/law_diff.py --base base --head head --labels "$LABELS"
